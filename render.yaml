services:
  - type: web
    name: siraflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: siraflow-api.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://siraflow.vercel.app
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://siraflow.vercel.app
      - key: DJANGO_TRUST_PROXY_SSL
        value: "true"
      - key: DJANGO_ANON_RATE
        value: 30/min
